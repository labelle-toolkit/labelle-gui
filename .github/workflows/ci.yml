name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Unit Tests (Linux)

    # build.zig.zon depends on `../labelle-engine` (#107 — PIE
    # viewport). Both checkouts go into named subdirs so the sibling
    # path resolves; all `run:` steps live inside labelle-gui via
    # `defaults.run.working-directory`.
    defaults:
      run:
        working-directory: labelle-gui

    steps:
      - name: Checkout labelle-gui
        uses: actions/checkout@v4
        with:
          path: labelle-gui

      - name: Checkout labelle-engine sibling
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-engine
          ref: main
          path: labelle-engine

      - name: Checkout labelle-core sibling
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-core
          ref: main
          path: labelle-core

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Cache the Zig package store and the build cache so repeat runs
      # don't re-download or re-compile the C++ deps (imgui, glfw, etc.)
      # that dominate cold-build time. Keyed on the dep lockfile + build
      # script, so any dep bump or build graph change invalidates cleanly.
      - name: Cache Zig deps + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            labelle-gui/.zig-cache
          key: zig-${{ runner.os }}-${{ hashFiles('labelle-gui/build.zig.zon', 'labelle-gui/build.zig') }}
          restore-keys: |
            zig-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Build production binary
        run: zig build -Dcpu=baseline

      - name: Build UI-test binary
        # Same build cache as the step above — the only extra cost is the
        # second zgui compilation with `with_te = true`. Lands the test
        # binary at zig-out/bin/gui-tests so the `ui-tests` job can pick
        # it up from the artifact instead of re-building from scratch.
        run: zig build gui-test-build -Dcpu=baseline

      - name: Unit Tests (zspec)
        run: zig build test -Dcpu=baseline

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: labelle-gui-Linux
          # `working-directory` doesn't apply to `uses:` action steps,
          # so the path needs the explicit prefix.
          path: labelle-gui/zig-out/bin/
          if-no-files-found: error

  # ImGui Test Engine harness — downloads the gui-tests binary built by
  # the `build` job and runs it under Xvfb. No Zig toolchain or build
  # step needed here; the heavy compilation happened once upstream.
  ui-tests:
    runs-on: ubuntu-latest
    name: ImGui Test Engine
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # The test binary needs the project tree at runtime to locate
        # `assets/fonts/fa-solid-900.ttf` (loaded relative to cwd by
        # `addFontFromFileWithConfig`). Source code isn't compiled here.

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: labelle-gui-Linux
          path: zig-out/bin/

      - name: Make executable
        run: chmod +x zig-out/bin/gui-tests

      - name: Install runtime dependencies
        # Runtime-only libs (no -dev) since we're not compiling here.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libgl1 \
            libxrandr2 \
            libxinerama1 \
            libxcursor1 \
            libxi6

      - name: Run UI tests under Xvfb
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          XVFB_PID=$!
          sleep 2
          ./zig-out/bin/gui-tests
          kill $XVFB_PID 2>/dev/null || true

  # Process-launch sanity check — confirms the production binary starts,
  # doesn't crash for a few seconds, and renders something. Separate from
  # `zig build gui-test` because that runs a *different* binary (the
  # test runner) that has its own with-test-engine zgui module.
  launch-check:
    runs-on: ubuntu-latest
    name: Launch Smoke (Linux)
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: labelle-gui-Linux
          path: zig-out/bin/

      - name: Make executable
        run: chmod +x zig-out/bin/labelle-gui

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgtk-3-0 \
            libgl1 \
            libxrandr2 \
            libxinerama1 \
            libxcursor1 \
            libxi6 \
            wmctrl \
            imagemagick

      - name: Launch and screenshot
        run: |
          # Start Xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          sleep 2

          # Start the application in background
          ./zig-out/bin/labelle-gui &
          APP_PID=$!
          sleep 5

          # Check if process is still running
          if ps -p $APP_PID > /dev/null; then
            echo "SUCCESS: Application started successfully (PID: $APP_PID)"

            # Try to get window info
            wmctrl -l || true

            # Take a screenshot using import (ImageMagick)
            import -window root -display :99 screenshot.png || true

            # Kill the app gracefully
            kill $APP_PID 2>/dev/null || true
            wait $APP_PID 2>/dev/null || true

            echo "Launch smoke passed!"
            exit 0
          else
            echo "FAILED: Application did not start or crashed"
            exit 1
          fi

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screenshot
          path: screenshot.png
          if-no-files-found: ignore
